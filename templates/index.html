<!DOCTYPE html>
<html>
<head>
    <title>Two-Tier Flask Application</title>
</head>
<body>

    <h1>Flask and MySQL Application</h1>

    <form method="POST">
        <input type="text" name="message"
               placeholder="Enter your message" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Saved Messages</h2>

    <ul>
        {% for message in messages %}
            <li>{{ message[0] }}</li>
        {% endfor %}
    </ul>

</body>
</html>
